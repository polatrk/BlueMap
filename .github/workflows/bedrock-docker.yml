name: Bedrock Docker image

# Builds the BlueMap for Bedrock image (implementations/bedrock/docker) and publishes it as
# ghcr.io/<owner>/bluemap-bedrock:latest (+ one tag per commit).
on:
  push:
    branches:
      - bedrock
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          # The Dockerfile clones and compiles this exact commit.
          context: "{{defaultContext}}:implementations/bedrock/docker"
          build-args: |
            REPO=https://github.com/${{ github.repository }}.git
            REF=${{ github.sha }}
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/bluemap-bedrock:latest
            ghcr.io/${{ github.repository_owner }}/bluemap-bedrock:${{ github.sha }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
