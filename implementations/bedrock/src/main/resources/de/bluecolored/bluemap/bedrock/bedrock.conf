## BlueMap for Bedrock Dedicated Server
##
## BlueMap reads the world directly from the BDS folder, read-only (it never writes to the world).
## Live player markers come from the BlueMap behavior pack (add-on), see the README.

# Path of the Bedrock Dedicated Server folder (the one containing server.properties and worlds/).
bds-folder: "${bds-folder}"

# How BlueMap talks to the BDS console:
#  - "none":     no console. The map still updates from the world files, but BDS only writes chunks
#                to disk from time to time, so updates are delayed. Player positions need the
#                "net" add-on variant (HTTP).
#  - "wrapper":  BlueMap starts BDS itself (bedrock-command) and relays its console: you keep typing
#                server commands in this terminal. Recommended.
#  - "external": BDS runs elsewhere (Docker, screen, tmux...). Console output is read with
#                console-command and commands are sent with command-template ("{cmd}" placeholder).
console-mode: "wrapper"

# wrapper: command starting BDS (empty = bedrock_server / bedrock_server.exe in bds-folder).
bedrock-command: ""

# external: examples for a Docker container running BDS inside "screen -S mc-server":
#console-command: "docker logs -f --tail 0 mc-bedrock-server"
#command-template: "docker exec mc-bedrock-server screen -S mc-server -p 0 -X stuff \"{cmd}\\r\""
# Without "{cmd}" in command-template, the command is written to the stdin of that command instead
# (one line), e.g. through ssh to the bluemap-bridge.sh script on the BDS host:
#console-command: "ssh bluemap@bds-host logs"
#command-template: "ssh bluemap@bds-host cmd"
console-command: ""
command-template: ""

# With a console (wrapper/external), BlueMap regularly asks BDS to flush the world to disk
# (save hold / save query / save resume), so map updates follow the game closely.
# Interval in seconds, 0 disables it.
save-interval: 30

# HTTP endpoint for the "net" add-on variant (Beta APIs): it POSTs player positions here.
# Requests must carry the header "Authorization: Bearer <addon-token>". Port 0 disables it.
addon-port: 8101
addon-token: "${addon-token}"
